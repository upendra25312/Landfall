# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: landfall
metadata:
  template: landfall@1.0.0

infra:
  provider: bicep
  path: infra

services:
  api:
    project: src/api
    language: python
    host: function

  web:
    project: src/web
    language: python
    host: containerapp
    docker:
      path: Dockerfile

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/postprovision.sh
      interactive: true
      continueOnError: false
