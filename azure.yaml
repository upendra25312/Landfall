# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: landfall
metadata:
  template: landfall@1.0.0

infra:
  provider: bicep
  path: infra

services:
  api:
    project: src/api
    language: python
    host: function

  web:
    project: src/web
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true

  calc:
    project: src/calc
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true

  # ca-drawio (E11.22 / C27b): SVG -> PNG rasteriser for the landing-zone diagram
  # embed in .pptx / .docx. First stood up with `az containerapp create` (no
  # schema-dropping `azd provision`); `azd deploy drawio` updates its image.
  drawio:
    project: src/drawio
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/postprovision.sh
      interactive: true
      continueOnError: false
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/eventgrid.ps1
      continueOnError: true
    posix:
      shell: sh
      run: ./scripts/eventgrid.sh
      interactive: true
      continueOnError: true
