<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landfall — Migration Assessment</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span class="dot"></span> Landfall — Migration Assessment</div>
    <span class="badge" id="statusBadge">Draft</span>
    <span class="pill" id="confPill">confidence —</span>
    <span class="spacer"></span>
    <select id="verSel" class="pill" title="Published version" hidden></select>
    <div class="dl">
      <a href="/dashboard/download/xlsx">Estimate (XLSX)</a>
      <a href="/dashboard/download/resource-plan-xlsx">Resource Plan (XLSX)</a>
      <a href="/dashboard/download/docx">Word</a>
      <a href="/dashboard/download/pptx">PowerPoint</a>
    </div>
  </div>
  <nav class="area-nav" id="areaNav" aria-label="Assessment Areas">
    <button type="button" class="area-btn active" data-area="overview">01 Overview</button>
    <button type="button" class="area-btn" data-area="data-discovery">02 Data &amp; Discovery</button>
    <button type="button" class="area-btn" data-area="current-estate">03 Current Estate</button>
    <button type="button" class="area-btn" data-area="target-arch">04 Target Architecture</button>
    <button type="button" class="area-btn" data-area="cost-poe">05 Cost &amp; POE</button>
    <button type="button" class="area-btn" data-area="strategy">06 Strategy (6R)</button>
    <button type="button" class="area-btn" data-area="waves">07 Waves</button>
    <button type="button" class="area-btn" data-area="timeline">08 Timeline</button>
    <button type="button" class="area-btn" data-area="resource-plan">09 Resource Plan</button>
    <button type="button" class="area-btn" data-area="capacity">10 Capacity</button>
    <button type="button" class="area-btn" data-area="readiness">11 Readiness</button>
    <button type="button" class="area-btn" data-area="risks">12 Risks</button>
    <button type="button" class="area-btn" data-area="deliverables">13 Deliverables</button>
    <button type="button" class="area-btn" data-area="guidance">14 MS Guidance</button>
    <button type="button" class="area-btn" data-area="evidence">15 Evidence</button>
  </nav>
</header>

<div class="wrap" id="root">
  <div class="empty" id="loading">Loading the assessment…</div>
</div>

<script src="/static/purify.min.js"></script>
<script src="/static/safe-html.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
